# 线上生效的 vhost —— 部署机 xiang 上位于
#   /etc/nginx/sites-available/yangtze.xunxiang.store
# 并软链到 /etc/nginx/sites-enabled/。
#
# 证书用 certbot webroot 方式签发（不会改写 nginx 配置）：
#   sudo certbot certonly --webroot -w /var/www/certbot -d yangtze.xunxiang.store
# 之后 certbot.timer 自动续期；续期依赖下面 80 端口那段 acme-challenge。

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yangtze.xunxiang.store;

    ssl_certificate /etc/letsencrypt/live/yangtze.xunxiang.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yangtze.xunxiang.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/yangtze;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（文件名带内容哈希）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name yangtze.xunxiang.store;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
